<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" width="860" height="840" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif' role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs><rect x="0" y="0" width="860" height="840" rx="14" fill="#fbfaf7"/><text x="28" y="40" font-size="20" font-weight="700" fill="#22252a">How Scan &amp; Clean decides (what the reversing showed)</text><rect x="28" y="50" width="56" height="4" rx="2" fill="#e8772e"/><rect x="120" y="80" width="620" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="430.0" y="106.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Read the file straight off the disk</text><text x="430.0" y="126.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">raw NTFS / FAT32 reads, not the Windows file API</text><rect x="120" y="184" width="620" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="430.0" y="210.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Run the property checks</text><text x="430.0" y="230.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">scoring weights come from the cloud + a 7 MB encrypted blob</text><rect x="120" y="288" width="620" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="430.0" y="314.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Set property bits on the file</text><text x="430.0" y="334.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">one bit per thing it noticed</text><rect x="120" y="392" width="620" height="120" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="430.0" y="422" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Collapse to one verdict by fixed priority</text><rect x="143.0" y="440" width="84" height="30" rx="7" fill="#c0392b"/><text x="185.0" y="460.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Malware</text><text x="234.0" y="460" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">&gt;</text><rect x="241.0" y="440" width="84" height="30" rx="7" fill="#e67e22"/><text x="283.0" y="460.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Suspicious</text><text x="332.0" y="460" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">&gt;</text><rect x="339.0" y="440" width="84" height="30" rx="7" fill="#8e44ad"/><text x="381.0" y="460.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">EWS</text><text x="430.0" y="460" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">&gt;</text><rect x="437.0" y="440" width="84" height="30" rx="7" fill="#c9a400"/><text x="479.0" y="460.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PUP</text><text x="528.0" y="460" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">&gt;</text><rect x="535.0" y="440" width="84" height="30" rx="7" fill="#7f8c8d"/><text x="577.0" y="460.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Cookie</text><text x="626.0" y="460" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">&gt;</text><rect x="633.0" y="440" width="84" height="30" rx="7" fill="#2471a3"/><text x="675.0" y="460.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Repair</text><text x="430.0" y="494" font-size="12" font-weight="400" fill="#5b6170" text-anchor="middle">the highest bit set wins</text><rect x="120" y="552" width="620" height="56" rx="10" fill="#fdf0e6" stroke="#e8772e" stroke-width="1.6"/><text x="430.0" y="584.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Verdict</text><rect x="120" y="648" width="620" height="104" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="430.0" y="674.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Removal</text><text x="430.0" y="694.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">Crusader service + kernel drivers</text><text x="430.0" y="714.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">BootDelete for locked files</text><text x="430.0" y="734.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">19 repair modules</text><path d="M430.0,144 L430.0,182" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M430.0,248 L430.0,286" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M430.0,352 L430.0,390" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M430.0,512 L430.0,550" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M430.0,608 L430.0,646" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><text x="430" y="796" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">HitmanPro 3.5 (SurfRight) underneath. Reversed in an isolated VM with Ghidra and REA.</text></svg>