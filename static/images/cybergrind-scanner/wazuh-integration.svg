<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif' role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs><rect x="0" y="0" width="960" height="850" rx="14" fill="#fbfaf7"/><text x="28" y="40" font-size="20" font-weight="700" fill="#22252a">Wiring it into Wazuh on the home server</text><rect x="28" y="50" width="56" height="4" rx="2" fill="#e8772e"/><rect x="60" y="84" width="360" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="240.0" y="110.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">A file lands in a quiet folder</text><text x="240.0" y="130.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">/tmp, /var/tmp, /dev/shm, ~/Downloads</text><rect x="60" y="188" width="360" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="240.0" y="220.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Wazuh FIM sees it in real time</text><rect x="60" y="284" width="360" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="240.0" y="306.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Active response wrapper</text><text x="240.0" y="326.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">scans that one file</text><rect x="540" y="84" width="360" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="720.0" y="110.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Nightly systemd timer</text><text x="720.0" y="130.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">busy folders: CI runner _work dirs</text><rect x="540" y="188" width="360" height="80" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="720.0" y="212.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">cgscan-sweep</text><text x="720.0" y="232.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">files changed in the last 25 hours</text><text x="720.0" y="252.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">capped at 2,000 per run</text><rect x="255" y="392" width="450" height="64" rx="10" fill="#fdf0e6" stroke="#e8772e" stroke-width="1.6"/><text x="480.0" y="418.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">cybergrind-scanner</text><text x="480.0" y="438.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">runs as an unprivileged cgscan user</text><rect x="255" y="500" width="450" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="522.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">/var/log/cgscan/cgscan.json</text><text x="480.0" y="542.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">one JSON line per finding or error</text><rect x="255" y="600" width="450" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="632.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Wazuh agent ships the log to the manager</text><rect x="205" y="700" width="550" height="76" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="722.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Custom rules fire</text><text x="480.0" y="742.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">100610-100615 on findings and errors</text><text x="480.0" y="762.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">100620-100621 on the nightly sweep summary</text><path d="M240.0,148 L240.0,186" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M240.0,244 L240.0,282" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M720.0,148 L720.0,186" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,456 L480.0,498" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,556 L480.0,598" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,656 L480.0,698" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M240,340 L240,366 L462,366 L462,390" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M720,268 L720,366 L498,366 L498,390" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><text x="480" y="822" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">Weekly, also on timers: refresh YARA rules (YARA Forge core, gated) and rebuild the local allowlist bloom.</text></svg>