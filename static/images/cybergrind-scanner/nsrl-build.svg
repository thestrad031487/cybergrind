<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 890" width="960" height="890" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif' role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs><rect x="0" y="0" width="960" height="890" rx="14" fill="#fbfaf7"/><text x="28" y="40" font-size="20" font-weight="700" fill="#22252a">Building the NSRL allowlist without melting a USB enclosure</text><rect x="28" y="50" width="56" height="4" rx="2" fill="#e8772e"/><rect x="255" y="80" width="450" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="106.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">NIST RDS 2026.03.1, modern minimal</text><text x="480.0" y="126.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">18.8 GB zip from the public S3 bucket</text><rect x="255" y="184" width="450" height="80" rx="10" fill="#fdf0e6" stroke="#e8772e" stroke-width="1.6"/><text x="480.0" y="208.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Throwaway Debian container on Proxmox</text><text x="480.0" y="228.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">240 GB thin disk on internal NVMe</text><text x="480.0" y="248.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">6 GB RAM, deleted afterward</text><rect x="255" y="304" width="450" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="326.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">unzip -t</text><text x="480.0" y="346.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">check every CRC before trusting the download</text><rect x="255" y="400" width="450" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="422.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Extract, then delete the zip</text><text x="480.0" y="442.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">about 170 GB of SQLite</text><rect x="255" y="496" width="450" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="522.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Stream the SHA-256 column</text><text x="480.0" y="542.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">432,866,777 rows, one at a time</text><rect x="255" y="600" width="450" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="626.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Bloom filter, false-positive rate 1 in a million</text><text x="480.0" y="646.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">1.56 GB, plus a SHA-256 of the file</text><rect x="65.0" y="722" width="250" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="190.0" y="748.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Laptop</text><text x="190.0" y="768.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">data/ next to the local bloom</text><rect x="355.0" y="722" width="250" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="748.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Home server</text><text x="480.0" y="768.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">/var/lib/cgscan, read-only</text><rect x="645.0" y="722" width="250" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="770.0" y="748.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Backup disk</text><text x="770.0" y="768.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">so I never rebuild this release</text><path d="M480.0,144 L480.0,182" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,264 L480.0,302" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,360 L480.0,398" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,456 L480.0,494" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,560 L480.0,598" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,664 L480.0,693.0 L190.0,693.0 L190.0,720" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,664 L480.0,720" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,664 L480.0,693.0 L770.0,693.0 L770.0,720" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><text x="480" y="832" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">Each copy checked against the build hash. Then the container gets destroyed.</text><text x="480" y="856" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">Build: 1 h 13 min of CPU, 5.8 GB peak RAM.</text></svg>