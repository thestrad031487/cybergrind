<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif' role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs><rect x="0" y="0" width="960" height="760" rx="14" fill="#fbfaf7"/><text x="28" y="40" font-size="20" font-weight="700" fill="#22252a">cybergrind-scanner: one file through the pipeline</text><rect x="28" y="50" width="56" height="4" rx="2" fill="#e8772e"/><rect x="330" y="80" width="300" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="102.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">File to scan</text><text x="480.0" y="122.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">path from the CLI or a --files-from list</text><rect x="330" y="176" width="300" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="198.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Hash it once</text><text x="480.0" y="218.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">SHA-256, shared by every check</text><rect x="41.0" y="290" width="200" height="86" rx="10" fill="#eef0f3" stroke="#3a3f47" stroke-width="1.6"/><text x="141.0" y="317.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">YARA</text><text x="141.0" y="337.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">rule metadata</text><text x="141.0" y="357.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">sets the weight</text><rect x="267.0" y="290" width="200" height="86" rx="10" fill="#eef0f3" stroke="#3a3f47" stroke-width="1.6"/><text x="367.0" y="317.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">MalwareBazaar</text><text x="367.0" y="337.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">hash lookup</text><text x="367.0" y="357.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">known malware samples</text><rect x="493.0" y="290" width="200" height="86" rx="10" fill="#eef0f3" stroke="#3a3f47" stroke-width="1.6"/><text x="593.0" y="317.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">TLSH fuzzy match</text><text x="593.0" y="337.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">distance to known-bad</text><text x="593.0" y="357.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">weight: Suspicious</text><rect x="719.0" y="290" width="200" height="86" rx="10" fill="#e8f4ec" stroke="#3a3f47" stroke-width="1.6"/><text x="819.0" y="317.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Allowlist blooms</text><text x="819.0" y="337.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">NSRL + local hashes</text><text x="819.0" y="357.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">weight: Clean</text><path d="M480.0,232 L480.0,261.0 L141.0,261.0 L141.0,288" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,232 L480.0,261.0 L367.0,261.0 L367.0,288" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,232 L480.0,261.0 L593.0,261.0 L593.0,288" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,232 L480.0,261.0 L819.0,261.0 L819.0,288" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><rect x="255" y="430" width="450" height="56" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="452.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Properties</text><text x="480.0" y="472.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">each check returns name + weight, e.g. yara:rule (Malware)</text><path d="M141.0,376 L141.0,403.0 L480.0,403.0 L480.0,428" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M367.0,376 L367.0,403.0 L480.0,403.0 L480.0,428" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M593.0,376 L593.0,403.0 L480.0,403.0 L480.0,428" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M819.0,376 L819.0,403.0 L480.0,403.0 L480.0,428" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><rect x="205" y="530" width="550" height="80" rx="10" fill="#fdf0e6" stroke="#e8772e" stroke-width="1.6"/><text x="480.0" y="554.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">Verdict rule</text><text x="480.0" y="574.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">highest weight wins</text><text x="480.0" y="594.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">an allowlist hit can clear PUP or Suspicious, never Malware</text><rect x="255" y="654" width="450" height="64" rx="10" fill="#ffffff" stroke="#3a3f47" stroke-width="1.6"/><text x="480.0" y="680.9" font-size="14" font-weight="700" fill="#22252a" text-anchor="middle">JSON report + exit code</text><text x="480.0" y="700.9" font-size="13" font-weight="400" fill="#5b6170" text-anchor="middle">0 Clean, 10 PUP, 20 Suspicious, 30 Malware, 2 error</text><path d="M480.0,136 L480.0,174" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,486 L480.0,528" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.0,610 L480.0,652" fill="none" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#ah)"/></svg>